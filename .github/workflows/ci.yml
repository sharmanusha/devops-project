name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
	id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Backend Image
        run: docker build -t backend ./backend

      - name: Tag Backend Image
        run: docker tag backend:latest ${{ steps.login-ecr.outputs.registry }}/backend:latest

      - name: Push Backend Image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/backend:latest

      - name: Build Frontend Image
        run: docker build -t frontend ./frontend

      - name: Tag Frontend Image
        run: docker tag frontend:latest ${{ steps.login-ecr.outputs.registry }}/frontend:latest

      - name: Push Frontend Image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/frontend:latest

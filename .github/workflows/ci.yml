name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Backend Image
        run: |
          docker build -t backend ./backend

      - name: Tag Backend Image
        run: |
          docker tag backend:latest 219602684384.dkr.ecr.ap-south-1.amazonaws.com/backend:latest

      - name: Push Backend Image
        run: |
          docker push 219602684384.dkr.ecr.ap-south-1.amazonaws.com/backend:latest

      - name: Build Frontend Image
        run: |
          docker build -t frontend ./frontend

      - name: Tag Frontend Image
        run: |
          docker tag frontend:latest 219602684384.dkr.ecr.ap-south-1.amazonaws.com/frontend:latest

      - name: Push Frontend Image
        run: |
          docker push 219602684384.dkr.ecr.ap-south-1.amazonaws.com/frontend:latest
